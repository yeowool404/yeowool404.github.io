<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="🦊 yeowool ヨール 여울 🤎 brown-hearted"/>
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="icon" href="/favicon.ico"/>
        <title>yeowool</title>
        <script type="importmap">
            { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }
        </script>
        <script>
            // Decide before first paint: devices with WebGL2 never see the fallback still.
            if (document.createElement('canvas').getContext('webgl2')) document.documentElement.classList.add('live');
        </script>
        <script type="module">
            const fallback = () => document.documentElement.classList.remove('live');
            if (document.documentElement.classList.contains('live')) {
                import('./assets/leaf-shadows.js')
                    .then(({ createLeafShadows }) => {
                        const header = createLeafShadows(document.getElementById('leaf-shadows'));
                        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) header.play();
                    })
                    .catch((e) => {
                        fallback();
                        throw e;
                    });
            }
        </script>
        <script type="module">
            // Everything under the header comes from data/site.json (shape: data/site.schema.json).
            const el = (tag, props = {}, ...children) => {
                const node = Object.assign(document.createElement(tag), props);
                node.append(...children);
                return node;
            };
            const link = (text, href) => el('a', { href, textContent: text, ...(href.startsWith('mailto:') ? {} : { target: '_blank' }) });

            // "a part of [some album](https://...) compilation" -> text and <a> nodes.
            const inline = (line) => line.split(/\[([^\]]+)\]\(([^)\s]+)\)/).map((part, i, parts) =>
                i % 3 === 0 ? part : i % 3 === 1 ? link(part, parts[i + 1]) : '').filter((n) => n !== '');

            const release = (r) => {
                const figure = el('figure', { className: 'image' },
                    el('a', { href: r.url, target: '_blank' }, el('img', { src: r.artwork, alt: r.title })),
                    el('h1', {}, `${r.emoji} `, link(r.title, r.url)));
                if (r.notes?.length) figure.append(el('h3', {}, ...r.notes.flatMap((line, i) => [...(i ? [el('br')] : []), ...inline(line)])));
                if (r.id) figure.id = r.id;
                return figure;
            };

            const site = await (await fetch('data/site.json')).json();
            const discography = el('div', { className: 'discography' });
            const years = [...new Set(site.discography.map((r) => r.year))].sort((a, b) => b - a);
            for (const year of years) {
                discography.append(el('h1', { className: 'year-header', textContent: year }),
                    ...site.discography.filter((r) => r.year === year).map(release));
            }
            document.querySelector('.page-body').append(
                el('h1', { textContent: site.name }),
                el('h2', { textContent: site.tagline }),
                el('br'),
                ...site.links.map((row) => el('h2', {}, `${row.icon} `, ...row.items.flatMap((l, i) => [...(i ? [' '] : []), link(l.label, l.url)]))),
                discography);
            if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
        </script>
        <style>
            html {
                -webkit-print-color-adjust: exact;
            }

            * {
                box-sizing: border-box;
                -webkit-print-color-adjust: exact;
            }

            html, body {
                margin: 0;
                padding: 0;
                scrollbar-width: none;
            }

            @media only screen {
                body {
                    margin: 2em auto;
                    max-width: 900px;
                    padding: 0 2em;
                }
            }
            
            /* Default state - two columns */
            .discography {
                margin-top: 7vh;
                margin-bottom: 10vh;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                row-gap: 5em;
                column-gap: 2em;
                width: 100%;
            }

            .year-header {
                grid-column: 1 / -1;
                margin-top: 0em;
                margin-bottom: -2em;
                font-size: 3vh;
                opacity: 0.7;
            }

            /* Single column for tablets and smaller screens */
            @media screen and (max-width: 600px) {
                .discography {
                    grid-template-columns: 1fr;
                    gap: 4em;
                }

                .image h1 {
                    font-size: 3vh;
                    margin-top: 2vh;
                }

                .image h3 {
                    font-size: 2vh;
                    margin-top: 0.5vh;
                }
            }

            /* Additional adjustments for phones */
            @media screen and (max-width: 430px) {
                body {
                    padding: 0 2em;
                    margin: 1em auto;
                }

                .image h1 {
                    font-size: 3.5vh;
                    margin-top: 2vh;
                }

                .image h3 {
                    font-size: 2vh;
                    margin-top: 0.5vh;
                }
            }

            /* Adjusted typography for larger screens */
            @media screen and (min-width: 601px) {
                .image h1 {
                    font-size: 2.5vh;
                    margin-top: 1.5vh;
                    margin-bottom: 0.2vh;
                }

                .image h3 {
                    font-size: 1.5vh;
                    margin-top: 0;
                }
            }

            body {
                line-height: 1.5;
                white-space: normal;
                background-color: #F9F4EF;
                color: #564537;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #1d1711;
                    color: #fbeee1;
                }
            }

            a, a.visited {
                color: inherit;
                text-decoration: underline;
            }

            h1, h2, h3 {
                margin-bottom: 0;
            }

            h1 {
                font-size: 3.5vh;
                font-weight: 600;
                margin-top: 3.5vh;
            }

            h2 {
                font-size: 3.5vh;
                font-weight: 400;
                margin-top: 1.5vh;
            }

            h3 {
                font-size: 2vh;
                font-weight: 400;
                margin-top: 1vh;
            }

            img {
                max-width: 100%;
                height: auto;
            }

            .sans {
                font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
            }

            .header {
                width: 100vw;
                max-height: 40vh;
                margin-left: calc(50% - 50vw);
                overflow: hidden;
            }

            .header img,
            #leaf-shadows {
                display: block;
                width: 100%;
                height: min(56.25vw, 40vh);
                object-fit: cover;
                image-rendering: pixelated;
            }

            #leaf-shadows,
            .live .header img {
                display: none;
            }

            .live #leaf-shadows {
                display: block;
            }

            .image {
                border: none;
                margin: 0;
                padding: 0;
                border-radius: 0;
                text-align: center;
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 0.5em;
            }

            .image img {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <article class="page sans">
            <header>
                <figure class="header">
                    <br>
                    <img src="assets/header.png" alt=""/>
                    <canvas id="leaf-shadows" aria-hidden="true"></canvas>
                </figure>
            </header>
            <div class="page-body"></div>
        </article>
    </body>
</html>
